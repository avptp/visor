name: Publica el visor

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprova que les dades són JSON vàlid
        run: |
          for f in dades/*.json dades/*.geojson; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "::error file=$f::JSON no vàlid"; exit 1; }
          done

      - name: Prepara el lloc
        run: |
          mkdir _lloc
          cp -r index.html css js img dades _lloc/
          [ -f CNAME ] && cp CNAME _lloc/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _lloc
      - id: desplegament
        uses: actions/deploy-pages@v4
